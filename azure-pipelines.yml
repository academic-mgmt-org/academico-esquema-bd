name: deploy-db-prod-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  - group: academico-db-production

stages:
  - stage: DeployProduction
    displayName: Deploy production database schema
    jobs:
      - deployment: ApplyMigrations
        displayName: Apply migrations
        environment: production
        pool:
          name: Default
          demands:
            - Agent.Name -equals self-hosted-agent
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - bash: |
                    set -euo pipefail

                    if ! command -v psql >/dev/null 2>&1; then
                      echo "[!] psql no esta instalado en el agente."
                      exit 1
                    fi

                    bash scripts/apply-migrations.sh
                  displayName: Apply database migrations
                  env:
                    DB_HOST: $(DB_HOST)
                    DB_PORT: $(DB_PORT)
                    DB_DATABASE: $(DB_DATABASE)
                    DB_USER: $(DB_USER)
                    DB_PASSWORD: $(DB_PASSWORD)
                    PGSSLMODE: require
