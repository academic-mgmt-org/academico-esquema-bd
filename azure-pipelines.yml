name: deploy-db-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

pr: none

resources:
  repositories:
    - repository: azureReposMirror
      type: git
      name: academico-esquema-bd
      ref: refs/heads/main

stages:
  - stage: MirrorToAzureRepos
    displayName: Mirror GitHub main to Azure Repos
    jobs:
      - job: PushToAzureRepos
        displayName: Push main to Azure Repos
        pool:
          name: Default
          demands:
            - Agent.Name -equals self-hosted-agent
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            path: github-source
            persistCredentials: false

          - checkout: azureReposMirror
            clean: true
            fetchDepth: 1
            path: azure-repos-mirror
            persistCredentials: true

          - bash: |
              set -euo pipefail

              if [ -z "${SYSTEM_ACCESSTOKEN:-}" ]; then
                echo "[!] System.AccessToken no esta disponible para este job."
                echo "[!] Habilita el token OAuth del pipeline y permisos de escritura del Build Service sobre Azure Repos."
                exit 1
              fi

              github_source_dir="$(Pipeline.Workspace)/github-source"
              azure_repos_dir="$(Pipeline.Workspace)/azure-repos-mirror"
              azure_repos_url="$(git -C "$azure_repos_dir" remote get-url origin)"

              cd "$github_source_dir"
              git -c http.extraheader="AUTHORIZATION: bearer ${SYSTEM_ACCESSTOKEN}" \
                push "$azure_repos_url" HEAD:refs/heads/main
            displayName: Push GitHub commit to Azure Repos
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - stage: DetectChanges
    displayName: Detect changed files
    dependsOn: MirrorToAzureRepos
    condition: succeeded('MirrorToAzureRepos')
    jobs:
      - job: Detect
        displayName: Detect database changes
        pool:
          name: Default
          demands:
            - Agent.Name -equals self-hosted-agent
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - bash: |
              set -euo pipefail

              changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
              echo "$changed_files"

              run_db_deploy=false
              while IFS= read -r file; do
                case "$file" in
                  migrations/*|scripts/*|azure-pipelines*.yml)
                    run_db_deploy=true
                    ;;
                esac
              done <<< "$changed_files"

              echo "##vso[task.setvariable variable=runDbDeploy;isOutput=true]$run_db_deploy"
              echo "[i] runDbDeploy=$run_db_deploy"
            name: DetectChangedFiles
            displayName: Detect database-related changes

  - stage: DeployDevelopment
    displayName: Deploy development database schema
    dependsOn: DetectChanges
    condition: eq(dependencies.DetectChanges.outputs['Detect.DetectChangedFiles.runDbDeploy'], 'true')
    variables:
      - group: academico-db-development
    jobs:
      - job: ApplyDevelopmentMigrations
        displayName: Apply development migrations
        pool:
          name: Default
          demands:
            - Agent.Name -equals self-hosted-agent
        steps:
          - checkout: self
            clean: true

          - bash: |
              set -euo pipefail

              if ! command -v psql >/dev/null 2>&1; then
                echo "[!] psql no esta instalado en el agente."
                exit 1
              fi

              bash scripts/apply-migrations.sh
            displayName: Apply database migrations
            env:
              DB_HOST: $(DB_HOST)
              DB_PORT: $(DB_PORT)
              DB_DATABASE: $(DB_DATABASE)
              DB_USER: $(DB_USER)
              DB_PASSWORD: $(DB_PASSWORD)
              PGSSLMODE: require

  - stage: ApproveProduction
    displayName: Approve production database deployment
    dependsOn:
      - DetectChanges
      - DeployDevelopment
    condition: and(eq(dependencies.DetectChanges.outputs['Detect.DetectChangedFiles.runDbDeploy'], 'true'), eq(dependencies.DeployDevelopment.result, 'Succeeded'))
    jobs:
      - job: WaitForApproval
        displayName: Wait for manual approval
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            displayName: Approve production deployment
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: gacalderonr@utn.edu.ec
              instructions: Revisar que las migraciones aplicadas en desarrollo sean correctas antes de continuar con produccion.
              onTimeout: reject

  - stage: DeployProduction
    displayName: Deploy production database schema
    dependsOn: ApproveProduction
    condition: succeeded('ApproveProduction')
    variables:
      - group: academico-db-production
    jobs:
      - job: ApplyProductionMigrations
        displayName: Apply production migrations
        pool:
          name: Default
          demands:
            - Agent.Name -equals self-hosted-agent
        steps:
          - checkout: self
            clean: true

          - bash: |
              set -euo pipefail

              if ! command -v psql >/dev/null 2>&1; then
                echo "[!] psql no esta instalado en el agente."
                exit 1
              fi

              bash scripts/apply-migrations.sh
            displayName: Apply database migrations
            env:
              DB_HOST: $(DB_HOST)
              DB_PORT: $(DB_PORT)
              DB_DATABASE: $(DB_DATABASE)
              DB_USER: $(DB_USER)
              DB_PASSWORD: $(DB_PASSWORD)
              PGSSLMODE: require
