name: mirror-github-to-azure-repos-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

pr: none

stages:
  - stage: MirrorToAzureRepos
    displayName: Mirror GitHub main to Azure Repos
    jobs:
      - job: PushToAzureRepos
        displayName: Push main to Azure Repos
        pool:
          name: Default
          demands:
            - Agent.Name -equals self-hosted-agent
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            path: github-source
            persistCredentials: false

          - bash: |
              set -euo pipefail

              if [ -z "${SYSTEM_ACCESSTOKEN:-}" ]; then
                echo "[!] System.AccessToken no esta disponible para este job."
                echo "[!] Habilita el token OAuth del pipeline y permisos de escritura del Build Service sobre Azure Repos."
                exit 1
              fi

              github_source_dir="$(Pipeline.Workspace)/github-source"
              azure_repos_url="https://dev.azure.com/fabrica-utn/academico-estudiantes/_git/academico-esquema-bd"

              cd "$github_source_dir"
              git -c http.extraheader="AUTHORIZATION: bearer ${SYSTEM_ACCESSTOKEN}" \
                push "$azure_repos_url" HEAD:refs/heads/main
            displayName: Push GitHub commit to Azure Repos
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
